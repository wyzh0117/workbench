name: Release macOS DMG

# 这个 workflow 只做一件事：构建 Universal macOS DMG、按固定 asset 文件名重命名、
# 生成 SHA-256，并作为 Release Asset 上传到触发它的 tag 上。
#
# 它不构建 Windows / Linux，不做自动更新、Nightly 或 Beta 通道，也不做多平台矩阵。
#
# 没有配置 Apple 凭据时：workflow 仍可运行，产出 ad-hoc 签名的 DMG，与本地手工构建结果一致，
# Release Notes 会如实说明「未签名 / 未公证」。
#
# 配置好下面的 secrets 之后：同一条 workflow 会自动完成 Developer ID 签名与 Apple 公证，
# 不需要再改代码。
#
# 需要的 repository secrets（任何密钥都不得写进本文件）：
#   APPLE_CERTIFICATE            Developer ID Application 证书的 base64（.p12）
#   APPLE_CERTIFICATE_PASSWORD   .p12 导出密码
#   APPLE_SIGNING_IDENTITY       例如 "Developer ID Application: NAME (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID          Apple ID 公证凭据
#   或 APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH   App Store Connect API Key 公证凭据
#
# 注意：本文件中的 DMG asset 文件名必须永远是 AI-Course-Workbench-macOS.dmg，
# 因为 README 与用户手里的「固定直链」依赖它：
#   https://github.com/<OWNER>/<REPO>/releases/latest/download/AI-Course-Workbench-macOS.dmg
# 不要改成带版本号的文件名。
#
# 发版规则（PROJECT_MASTER_CONTROL.md §0.4）：已发布的 tag 不可变。
# 一个 tag 一旦发布，它和它的资产就冻结；发现问题要「修代码 → 新 commit → 新 tag → 新 Release」，
# 不能用新代码重新构建同一个 tag。
#
# 这条规则由下面的 "Publish release assets" 步骤强制执行：如果目标 tag 的 Release 已经发布
# （isDraft=false），workflow 会直接失败并提示改发新 tag，不会覆盖任何已发布资产 ——
# 覆盖会让已经下载过该版本的人拿到同名但 SHA-256 不同的文件。
# 唯一允许补齐资产的情况是 Release 仍是 draft，即「建 Release」这一步没有走完。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build Universal DMG
    runs-on: macos-latest

    steps:
      # Actions are pinned to commit SHAs because this job handles an Apple
      # signing certificate. Bump the SHA (and keep the trailing version
      # comment) when you intentionally upgrade an action.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Add macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Optional App Store Connect API-key notarization route. `APPLE_API_KEY_PATH`
      # cannot be a repository secret — it has to be a real .p8 file that exists on
      # the runner — so when APPLE_API_KEY_P8 is provided we write it to a
      # runner-temporary path and export it for the build step below.
      # If you use the Apple ID route instead (APPLE_ID + APPLE_PASSWORD +
      # APPLE_TEAM_ID), leave APPLE_API_KEY_P8 unset and this step does nothing.
      - name: Materialize App Store Connect API key (optional)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "APPLE_API_KEY_P8 is not set; assuming the Apple ID route (or ad-hoc)."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "Wrote the App Store Connect API key to a runner-temporary path."

      - name: Build Universal app + DMG
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 有证书就导入并签名；没有就退回 ad-hoc（"-"），让流程依然可以跑通。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # Apple ID 公证路线：
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # API Key 公证路线（APPLE_API_KEY_PATH 由上一个步骤写入 runner 临时目录后经
          # GITHUB_ENV 传进来；不要把它配成 repository secret）：
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Stage release assets with the stable filename
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          SRC_DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$SRC_DMG" ]; then
            echo "No DMG produced under $BUNDLE_DIR/dmg" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$SRC_DMG" dist/AI-Course-Workbench-macOS.dmg
          cd dist
          shasum -a 256 AI-Course-Workbench-macOS.dmg > AI-Course-Workbench-macOS.dmg.sha256
          cat AI-Course-Workbench-macOS.dmg.sha256
          ls -l

      - name: Verify signature state of the shipped app
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/AI Course Workbench.app"
          echo "--- lipo ---"
          lipo -archs "$APP/Contents/MacOS/ai-course-workbench" || true
          echo "--- codesign ---"
          codesign -dv --verbose=4 "$APP" 2>&1 || true
          echo "--- spctl ---"
          spctl --assess --type execute --verbose "$APP" 2>&1 || true

      - name: Publish release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SHA="$(cut -d' ' -f1 dist/AI-Course-Workbench-macOS.dmg.sha256)"

          if codesign -dv "src-tauri/target/universal-apple-darwin/release/bundle/macos/AI Course Workbench.app" 2>&1 | grep -q "Developer ID Application"; then
            SIGNING_LINE="- Signed with Apple Developer ID and notarized."
            FIRST_LAUNCH="- 已签名并公证，直接双击打开即可。"
          else
            SIGNING_LINE="- NOT signed with an Apple Developer ID and NOT notarized."
            # macOS 15 (Sequoia) removed the Control-click override for software that
            # is not correctly signed or notarized, so the right-click path must not be
            # presented as the only way in.  Both routes are documented below.
            FIRST_LAUNCH="$(cat <<'NOTES'
          - 首次打开需要手动放行一次，方式取决于 macOS 版本：
            - **macOS 15 (Sequoia) / 26 及更新版本**：Control-click 已无法绕过 Gatekeeper。
              双击后点「完成」→ 打开「系统设置 → 隐私与安全性」→ 在「安全性」区域点「仍要打开」→ 输入密码或 Touch ID 确认。
            - **macOS 11 (Big Sur) – 14 (Sonoma)**：在「应用程序」中右键点击（或按住 Control 点击）
              AI Course Workbench → 选择「打开」→ 在弹窗中再次点「打开」。
            - 放行一次之后，双击即可正常打开。
          - 不建议关闭 Gatekeeper，也不建议用 `xattr` 移除隔离属性。
          NOTES
          )"
          fi

          cat > dist/release-notes.md <<EOF
          # AI Course Workbench ${VERSION}

          首个可公开安装的 macOS 分发版本。

          ## System

          - macOS 11.0 (Big Sur) 或更高版本
          - Architecture: Universal（Apple Silicon arm64 + Intel x86_64，同一个安装包）

          ## Install

          1. 下载 \`AI-Course-Workbench-macOS.dmg\`
          2. 双击打开 DMG
          3. 将 **AI Course Workbench** 拖到 Applications
          4. 从 Applications 打开

          ${FIRST_LAUNCH}

          ## Distribution status

          ${SIGNING_LINE}

          ## Verify

          \`\`\`
          ${SHA}  AI-Course-Workbench-macOS.dmg
          \`\`\`

          \`\`\`bash
          shasum -a 256 ~/Downloads/AI-Course-Workbench-macOS.dmg
          \`\`\`

          ## Links

          - Latest release page: https://github.com/${GITHUB_REPOSITORY}/releases/latest
          - Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AI-Course-Workbench-macOS.dmg
          EOF

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Normal path: a brand-new tag, so the Release does not exist yet.
            gh release create "$TAG" \
              dist/AI-Course-Workbench-macOS.dmg \
              dist/AI-Course-Workbench-macOS.dmg.sha256 \
              --title "AI Course Workbench ${VERSION}" \
              --notes-file dist/release-notes.md \
              --verify-tag
          else
            # The Release already exists.  PROJECT_MASTER_CONTROL.md §0.4: a PUBLISHED tag
            # is frozen — its assets must never change, because anyone who already
            # downloaded it must be able to match that file's SHA-256 against this version
            # number forever.  Only an unpublished (draft) Release — one whose creation
            # never completed — may still be filled in.
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Release $TAG is still a draft; filling in its assets."
              # --clobber is safe here: a draft is not publicly visible, so this cannot
              # change bytes that anyone has already downloaded.
              gh release upload "$TAG" \
                dist/AI-Course-Workbench-macOS.dmg \
                dist/AI-Course-Workbench-macOS.dmg.sha256 \
                --clobber
              gh release edit "$TAG" --notes-file dist/release-notes.md
            else
              # Refuse, loudly.  Overwriting here would hand anyone who already downloaded
              # this tag a same-named file with a different SHA-256, which is exactly what
              # the freeze rule exists to prevent.
              echo "::error::Release $TAG is already published, so its assets are frozen (PROJECT_MASTER_CONTROL.md §0.4)."
              echo "::error::Refusing to overwrite it. Cut a new version instead: fix -> new commit -> new tag -> new Release."
              {
                echo "## Refusing to overwrite the published release $TAG"
                echo ""
                echo "Release $TAG is already published (isDraft=false), so its assets are **frozen** by §0.4 of PROJECT_MASTER_CONTROL.md."
                echo ""
                echo "Overwriting it would give anyone who already downloaded $TAG a same-named file with a different SHA-256 — exactly what the rule prevents."
                echo ""
                echo "To ship this build, cut a NEW version: fix -> new commit -> new tag -> new Release (for example v0.1.1 -> v0.1.2)."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi