name: Release (macOS DMG + Windows NSIS)

# 这个 workflow 只做一件事：构建 macOS Universal DMG 与 Windows x64 NSIS 安装包、
# 按固定 asset 文件名重命名、生成 SHA-256，并作为 Release Assets 上传到触发它的 tag。
#
# 它不构建 Linux，不做自动更新、Nightly 或 Beta 通道。
#
# 没有配置 Apple 凭据时：macOS job 仍可运行，产出 ad-hoc 签名的 DMG，与本地手工构建
# 结果一致，Release Notes 会如实说明「未签名 / 未公证」。Windows 安装包当前始终
# 未做 Authenticode 签名，Notes 同样如实说明。
#
# 配置好下面的 macOS secrets 之后：同一条 workflow 会自动完成 Developer ID 签名与
# Apple 公证，不需要再改代码。
#
# 需要的 repository secrets（任何密钥都不得写进本文件）：
#   APPLE_CERTIFICATE            Developer ID Application 证书的 base64（.p12）
#   APPLE_CERTIFICATE_PASSWORD   .p12 导出密码
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID          Apple ID 公证凭据
#   或 APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_PATH   App Store Connect API Key 公证凭据
# Tauri infers the signing identity from the imported certificate when none is configured.
#
# 注意：本文件中的 asset 文件名必须永远保持固定，因为 README 与用户手里的「固定直链」
# 依赖它们：
#   https://github.com/<OWNER>/<REPO>/releases/latest/download/AI-Course-Workbench-macOS.dmg
#   https://github.com/<OWNER>/<REPO>/releases/latest/download/AI-Course-Workbench-Windows-x64-setup.exe
# 不要改成带版本号的文件名。
#
# 发版规则：已发布的 tag 不可变。一个 tag 一旦发布，它和它的资产就冻结；发现问题要
# 「修代码 → 新 commit → 新 tag → 新 Release」，不能用新代码重新构建同一个 tag。
#
# 这条规则由下面的 "Create or fill the GitHub Release" 步骤强制执行：如果目标 tag 的
# Release 已经发布（isDraft=false），workflow 会直接失败并提示改发新 tag，不会覆盖
# 任何已发布资产 —— 覆盖会让已经下载过该版本的人拿到同名但 SHA-256 不同的文件。
# 唯一允许补齐资产的情况是 Release 仍是 draft，即「建 Release」这一步没有走完。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    name: Build Universal DMG
    runs-on: macos-latest
    outputs:
      is_signed: ${{ steps.signing.outputs.is_signed }}
    env:
      HAS_APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      # Actions are pinned to commit SHAs because this job handles an Apple
      # signing certificate. Bump the SHA (and keep the trailing version
      # comment) when you intentionally upgrade an action.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify pushed tag matches app version
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          EXPECTED_TAG="v${APP_VERSION}"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Refusing release: tag $GITHUB_REF_NAME does not match app version $EXPECTED_TAG." >&2
            exit 1
          fi

      - name: Add macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Optional App Store Connect API-key notarization route. `APPLE_API_KEY_PATH`
      # cannot be a repository secret — it has to be a real .p8 file that exists on
      # the runner — so when APPLE_API_KEY_P8 is provided we write it to a
      # runner-temporary path and export it for the build step below.
      # If you use the Apple ID route instead (APPLE_ID + APPLE_PASSWORD +
      # APPLE_TEAM_ID), leave APPLE_API_KEY_P8 unset and this step does nothing.
      - name: Materialize App Store Connect API key (optional)
        if: ${{ env.HAS_APPLE_SIGNING_CERTIFICATE == 'true' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "APPLE_API_KEY_P8 is not set; assuming the Apple ID route (or ad-hoc)."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "Wrote the App Store Connect API key to a runner-temporary path."

      - name: Build Universal app + DMG (Developer ID)
        if: ${{ env.HAS_APPLE_SIGNING_CERTIFICATE == 'true' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Apple ID 公证路线：
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # API Key 公证路线（APPLE_API_KEY_PATH 由上一个步骤写入 runner 临时目录后经
          # GITHUB_ENV 传进来；不要把它配成 repository secret）：
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Build Universal app + DMG (ad-hoc)
        if: ${{ env.HAS_APPLE_SIGNING_CERTIFICATE != 'true' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Stage release assets with the stable filename
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          SRC_DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$SRC_DMG" ]; then
            echo "No DMG produced under $BUNDLE_DIR/dmg" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$SRC_DMG" dist/AI-Course-Workbench-macOS.dmg
          cd dist
          shasum -a 256 AI-Course-Workbench-macOS.dmg > AI-Course-Workbench-macOS.dmg.sha256
          cat AI-Course-Workbench-macOS.dmg.sha256
          ls -l

      - name: Verify signature state of the shipped app
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/AI Course Workbench.app"
          echo "--- lipo ---"
          lipo -archs "$APP/Contents/MacOS/ai-course-workbench" || true
          echo "--- codesign ---"
          codesign -dv --verbose=4 "$APP" 2>&1 || true
          echo "--- spctl ---"
          spctl --assess --type execute --verbose "$APP" 2>&1 || true

      - name: Record signing state for the release notes
        id: signing
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/AI Course Workbench.app"
          if codesign -dv "$APP" 2>&1 | grep -q "Developer ID Application"; then
            echo "is_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: dist/*
          if-no-files-found: error

  windows-nsis:
    name: Build Windows NSIS installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify pushed tag matches app version
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Refusing release: tag $env:GITHUB_REF_NAME does not match app version $expected."
          }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Build Windows app + NSIS installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis

      - name: Stage release assets with the stable filename
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "src-tauri/target/release/bundle/nsis"
          $src = Get-ChildItem $bundle -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $src) { throw "No NSIS installer produced under $bundle" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $src.FullName 'dist/AI-Course-Workbench-Windows-x64-setup.exe'
          $hash = (Get-FileHash 'dist/AI-Course-Workbench-Windows-x64-setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  AI-Course-Workbench-Windows-x64-setup.exe" | Set-Content 'dist/AI-Course-Workbench-Windows-x64-setup.exe.sha256' -NoNewline
          Get-Content 'dist/AI-Course-Workbench-Windows-x64-setup.exe.sha256'
          Get-ChildItem dist | Format-Table Name, Length

      - name: Verify version resource of the shipped installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item 'dist/AI-Course-Workbench-Windows-x64-setup.exe'
          $vi = $setup.VersionInfo
          Write-Host "ProductVersion=$($vi.ProductVersion) FileVersion=$($vi.FileVersion) ProductName=$($vi.ProductName)"
          if ($vi.ProductVersion -ne $env:GITHUB_REF_NAME.TrimStart('v')) {
            throw "Installer version $($vi.ProductVersion) does not match tag $($env:GITHUB_REF_NAME)."
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Create or fill the GitHub Release
    # Only the tag push publishes; workflow_dispatch stays build-only even on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [macos-dmg, windows-nsis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets (freeze-checked)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MAC_SHA="$(cut -d' ' -f1 dist/AI-Course-Workbench-macOS.dmg.sha256)"
          WIN_SHA="$(cut -d' ' -f1 dist/AI-Course-Workbench-Windows-x64-setup.exe.sha256)"

          MAC_SIGNED="${{ needs.macos-dmg.outputs.is_signed }}"
          if [ "$MAC_SIGNED" = "true" ]; then
            SIGNING_LINE="- macOS: Signed with Apple Developer ID and notarized."
            FIRST_LAUNCH="- macOS 已签名并公证，直接双击打开即可。"
          else
          SIGNING_LINE="- macOS: NOT signed with an Apple Developer ID and NOT notarized."
          FIRST_LAUNCH="$(cat <<'NOTES'
          - 首次打开需要手动放行一次，方式取决于 macOS 版本：
            - **macOS 15 (Sequoia) / 26 及更新版本**：Control-click 已无法绕过 Gatekeeper。
              双击后点「完成」→ 打开「系统设置 → 隐私与安全性」→ 在「安全性」区域点「仍要打开」→ 输入密码或 Touch ID 确认。
            - **macOS 11 (Big Sur) – 14 (Sonoma)**：在「应用程序」中右键点击（或按住 Control 点击）
              AI Course Workbench → 选择「打开」→ 在弹窗中再次点「打开」。
            - 放行一次之后，双击即可正常打开。
          - 不建议关闭 Gatekeeper，也不建议用 `xattr` 移除隔离属性。
          NOTES
          )"
          fi

          NOTES_FILE=".github/release-notes/${TAG}.md"
          {
            printf '# AI Course Workbench %s\n\n' "$VERSION"
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
              printf '\n'
            else
              printf 'macOS Universal DMG + Windows x64 installer.\n\n'
            fi
            cat <<EOF
          ## Downloads

          | Platform | Installer | SHA-256 sidecar |
          |---|---|---|
          | Windows (x64) | [AI-Course-Workbench-Windows-x64-setup.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AI-Course-Workbench-Windows-x64-setup.exe) | [.sha256](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AI-Course-Workbench-Windows-x64-setup.exe.sha256) |
          | macOS (Universal) | [AI-Course-Workbench-macOS.dmg](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AI-Course-Workbench-macOS.dmg) | [.sha256](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AI-Course-Workbench-macOS.dmg.sha256) |

          ## System

          - Windows: Windows 10 (1809+) with WebView2; x64 installer (per-user, no admin rights)
          - macOS: macOS 11.0 (Big Sur) 或更高版本; Universal（Apple Silicon arm64 + Intel x86_64，同一个安装包）

          ## Install

          ### Windows

          1. 下载 \`AI-Course-Workbench-Windows-x64-setup.exe\`
          2. 运行安装向导（按用户安装）
          3. 从开始菜单打开 **AI Course Workbench**
          - SmartScreen 提示时选「更多信息 → 仍要运行」（安装包未做 Authenticode 签名）。

          ### macOS

          1. 下载 \`AI-Course-Workbench-macOS.dmg\`
          2. 双击打开 DMG
          3. 将 **AI Course Workbench** 拖到 Applications
          4. 从 Applications 打开

          ${FIRST_LAUNCH}

          ## Distribution status

          ${SIGNING_LINE}
          - Windows: NOT signed with an Authenticode certificate; SmartScreen may warn once.

          ## Verify

          \`\`\`
          ${WIN_SHA}  AI-Course-Workbench-Windows-x64-setup.exe
          ${MAC_SHA}  AI-Course-Workbench-macOS.dmg
          \`\`\`

          \`\`\`powershell
          Get-FileHash .\\AI-Course-Workbench-Windows-x64-setup.exe -Algorithm SHA256
          \`\`\`

          \`\`\`bash
          shasum -a 256 ~/Downloads/AI-Course-Workbench-macOS.dmg
          \`\`\`

          ## Links

          - Latest release page: https://github.com/${GITHUB_REPOSITORY}/releases/latest
          - Direct download (Windows): https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AI-Course-Workbench-Windows-x64-setup.exe
          - Direct download (macOS): https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AI-Course-Workbench-macOS.dmg
          EOF
          } > dist/release-notes.md

          ASSETS=(
            dist/AI-Course-Workbench-macOS.dmg
            dist/AI-Course-Workbench-macOS.dmg.sha256
            dist/AI-Course-Workbench-Windows-x64-setup.exe
            dist/AI-Course-Workbench-Windows-x64-setup.exe.sha256
          )

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Normal path: a brand-new tag, so the Release does not exist yet.
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "AI Course Workbench ${VERSION}" \
              --notes-file dist/release-notes.md \
              --verify-tag
          else
            # The Release already exists. A PUBLISHED tag is frozen — its assets
            # must never change, because anyone who already downloaded it must
            # be able to match that file's SHA-256 against this version number
            # forever. Only an unpublished (draft) Release — one whose creation
            # never completed — may still be filled in.
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Release $TAG is still a draft; filling in its assets."
              # --clobber is safe here: a draft is not publicly visible, so this cannot
              # change bytes that anyone has already downloaded.
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
              gh release edit "$TAG" --notes-file dist/release-notes.md
            else
              # Refuse, loudly. Overwriting here would hand anyone who already
              # downloaded this tag a same-named file with a different SHA-256.
              echo "::error::Release $TAG is already published, so its assets are frozen."
              echo "::error::Refusing to overwrite it. Cut a new version instead: fix -> new commit -> new tag -> new Release."
              {
                echo "## Refusing to overwrite the published release $TAG"
                echo ""
                echo "Release $TAG is already published (isDraft=false), so its assets are **frozen**."
                echo ""
                echo "Overwriting it would give anyone who already downloaded $TAG a same-named file with a different SHA-256 — exactly what the rule prevents."
                echo ""
                echo "To ship this build, fix it in a new commit and cut a new tag; never reuse a published tag."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
