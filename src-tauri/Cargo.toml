[package]
name = "ai-course-workbench"
version = "0.1.0"
description = "Local-first desktop shell for AI Course Workbench"
authors = ["AI Course Workbench"]
edition = "2021"

[lib]
name = "ai_course_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
